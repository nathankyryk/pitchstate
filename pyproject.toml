[project]
name = "pitchstate"
version = "0.1.0"
description = "Soccer game-state reconstruction (detection, SAM 3.1 masks, tracking, pitch mapping) with an LLM match analyst, evaluated on SoccerNet GSR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "soccernet>=0.2.0",
]

[project.scripts]
pitchstate = "pitchstate:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
